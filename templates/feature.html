<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Feature</title>
<style>{{base_css}}</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div class="logo">{{logo_svg}}</div>
    <div class="kicker">{{kicker}}</div>
  </div>
  <h1>{{headline}}</h1>
  <div class="screen">
    <div class="bar"><span>{{screen_title}}</span><span class="live">● {{screen_status}}</span></div>
    <table>
      <thead><tr>{{columns}}</tr></thead>
      <tbody>{{rows}}</tbody>
    </table>
    <div class="actions"><span class="button">{{button}} <span>→</span></span></div>
  </div>
  <div class="grow"></div>
  <div class="foot">
    <div class="note">{{footer}}</div>
    <div class="link">intelliai.au →</div>
  </div>
</div>
</body>
</html>
