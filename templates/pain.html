<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Pain</title>
<style>{{base_css}}</style>
</head>
<body class="landscape">
<div class="page">
  <div class="top">
    <div class="logo">{{logo_svg}}</div>
    <div class="kicker">{{kicker}}</div>
  </div>
  <div class="split">
    <div>
      <h1>{{headline}}</h1>
      <p class="sub">{{sub}}</p>
      <span class="button">{{button}} <span>→</span></span>
    </div>
    <div class="sheet">
      <div class="head"><span>{{sheet_title}}</span><span>{{sheet_meta}}</span></div>
      <table>
        <thead><tr>{{columns}}</tr></thead>
        <tbody>{{rows}}</tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
