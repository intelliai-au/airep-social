<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Website</title>
<style>{{base_css}}</style>
</head>
<body>
<div class="page site-{{frame}}">
  <div class="top">
    <div class="logo">{{logo_svg}}</div>
    <div class="kicker">{{kicker}}</div>
  </div>
  <div class="showcase">
    <div class="copy">
      <h1>{{headline}}</h1>
      <p class="sub">{{sub}}</p>
      <div class="chips">{{rows}}</div>
    </div>
    <div class="device {{frame}}">
      <div class="bezel"><img src="{{shot}}" alt=""></div>
      <div class="site-url">{{site_url}}</div>
    </div>
  </div>
  <div class="grow"></div>
  <div class="foot">
    <div class="note">{{footer}}</div>
    <div class="link">{{foot_link}}</div>
  </div>
</div>
</body>
</html>
