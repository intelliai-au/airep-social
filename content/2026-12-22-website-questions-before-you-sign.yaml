fields:
  kicker_left: "Field notes · websites"
  kicker_right: "Small business · AU"
  headline: "Six questions *before you sign.*"
  sub: "Ask them of any web company, us included, and get the answers in writing. Worth the time over the break."
  # Our own answers are in the tag column; each one is on airep templates/pages/websites.html.
  # No 48-hour demo push this week or next: nobody builds a demo over Christmas.
  rows:
    - { label: "The price", text: "Is it fixed, or an estimate that can grow?", tag: "fixed" }
    - { label: "The monthly", text: "What does it cover, and what costs extra?", tag: "listed" }
    - { label: "Rises", text: "Can it go up, how often, and by how much?", tag: "capped" }
    - { label: "Web address", text: "Is it registered in your business's name?", tag: "yours" }
    - { label: "Leaving", text: "How much notice, and what do you get back?", tag: "30 days" }
    - { label: "Changes", text: "What does a small change cost later?", tag: "quoted" }
  test: "The tag column is our answer to each. Ask the same six of anyone else."
