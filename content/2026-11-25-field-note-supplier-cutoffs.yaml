  headline: "Six dates to get *from every supplier* before December."
  sub: "Christmas cut-offs move every year and nobody emails them. Ask once, write them on the supplier record, and plan the last PO backwards."
  rows:
    - { label: "Last order", text: "The last day they accept a PO for dispatch before Christmas.", tag: "ask" }
    - { label: "Last dispatch", text: "The day the last truck leaves their dock, which is not the last order day.", tag: "ask" }
    - { label: "Carrier cut-off", text: "Your freight company's own last pickup. Often earlier than the supplier's.", tag: "ask" }
    - { label: "Closed", text: "Their first closed day, and whether orders bank up or bounce while they're away.", tag: "ask" }
    - { label: "Reopen", text: "The day they are back. Not the day they dispatch.", tag: "ask" }
    - { label: "First delivery", text: "Reopen plus lead time: the first date new stock can land on your floor.", tag: "work out" }
  test: "Test: can you list every open purchase order due after its supplier's cut-off, today, without a phone call?"
