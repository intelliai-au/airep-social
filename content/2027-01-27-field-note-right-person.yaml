  The person who orders is rarely the person who pays. Quotes and confirmations go to the buyer, delivery details to site, and invoices, statements and reminders to accounts payable.
  Send each document to whoever acts on it.
  In AIREP each person at a customer is a CRM contact, so every quote, confirmation and invoice email can go to the right one.
  https://intelliai.au
