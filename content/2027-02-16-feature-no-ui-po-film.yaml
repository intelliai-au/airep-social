linkedin: |
  Type the purchase order in one sentence: the supplier, the item codes and the quantities. Nova reads it against your own data, resolves the codes and prices each line at what that supplier charges you.
  It shows the draft first, and nothing exists until you say so; the purchase order lands as a draft for a buyer to check.
  Same rules and permissions as the form, without the form.
  https://intelliai.au/airep/
